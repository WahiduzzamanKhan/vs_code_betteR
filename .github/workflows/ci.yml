name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Side by side, as in development: the extension falls back to
      # ../betteR/target/debug/better.
      - uses: actions/checkout@v7
        with:
          path: vs_code_betteR

      # Build the console from the branch with the same name (feature/x,
      # develop, release/0.3.0), else the pull request's base branch, else main.
      - name: Pick the console branch
        id: console
        shell: bash
        env:
          CANDIDATES: ${{ github.head_ref || github.ref_name }} ${{ github.base_ref }} main
        run: |
          set -f
          for b in $CANDIDATES; do
            if git ls-remote --exit-code --heads https://github.com/WahiduzzamanKhan/betteR.git "refs/heads/$b" > /dev/null; then
              echo "Building the console from branch $b"
              echo "ref=$b" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No matching betteR branch among: $CANDIDATES"
          exit 1

      - uses: actions/checkout@v7
        with:
          repository: WahiduzzamanKhan/betteR
          ref: ${{ steps.console.outputs.ref }}
          path: betteR

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # CRAN's macOS R links its Cairo devices (svg(), used for plot export)
      # against XQuartz.
      - name: Install XQuartz
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: betteR

      - name: Build better
        working-directory: betteR
        run: cargo build --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vs_code_betteR/package-lock.json

      - name: Install dependencies
        working-directory: vs_code_betteR
        run: npm ci

      # Written by Node, so the Windows path (D:\a\...) is escaped properly in the JSON.
      - name: Use the fresh better build in the test VS Code
        working-directory: vs_code_betteR
        shell: bash
        run: |
          mkdir -p .vscode-test/user-data/User
          node -e '
            const path = require("path");
            const exe = process.platform === "win32" ? "better.exe" : "better";
            const better = path.join(process.env.GITHUB_WORKSPACE, "betteR", "target", "debug", exe);
            require("fs").writeFileSync(".vscode-test/user-data/User/settings.json", JSON.stringify({ "betteR.consolePath": better }));'
          cat .vscode-test/user-data/User/settings.json

      - name: Integration tests
        working-directory: vs_code_betteR
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm test
          else
            npm test
          fi

      - name: Kernel logs
        if: failure() && runner.os != 'Windows'
        run: |
          for f in "${TMPDIR:-/tmp}"/better-vscode-*/ark.log; do
            [ -f "$f" ] && { echo "::group::$f"; cat "$f"; echo "::endgroup::"; }
          done
          true

      - name: Kernel logs (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem $env:TEMP -Directory -Filter 'better-vscode-*' -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'ark.log' } |
            Where-Object { Test-Path $_ } |
            ForEach-Object { "::group::$_"; Get-Content $_; "::endgroup::" }
